name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Run lint
        run: make lint

      - name: Run tests with coverage report
        run: python -m pytest tests --cov=agrivision --cov-report=term-missing

      - name: Smoke-check config loading
        run: make smoke-config

      - name: Validate root compose file
        run: docker compose -f docker-compose.yml config

      - name: Validate root Dockerfile build
        run: docker build -f Dockerfile -t agrivision-ci-root .
