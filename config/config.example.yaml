# Global configuration for the AgriVision Pipeline

location:
  name: "Neapolis, Agios Nikolaos, Crete"
  lat: 35.2600
  lon: 25.6000

paths:
  data_root: "data"
  output_root: "output"

  # RGB images (default dataset for current pipeline)
  images_full: "data/images_full/rgb"
  # ODM projects
  # For backwards compatibility, odm_project_root points to the RGB project.
  odm_project_root: "data/odm_project_rgb"
  odm_project_root_rgb: "data/odm_project_rgb"
  odm_project_root_mapir: "data/odm_project_mapir"

  # Vegetation Index + runs output
  vegetation_index_output: "output/vegetation_index"
  runs_output: "output/runs"

  # MAPIR image paths (for multispectral / false-color)
  images_full_mapir: "data/images_full/mapir"
  images_full_thermal: "data/images_full/thermal"
  odm_project_root_thermal: "data/odm_project_thermal"
vegetation_index:
  # Classification thresholds (used by grid/report)
  poor_max: 0.25
  medium_max: 0.4
  grid_rows: 17
  grid_cols: 17

  # ----------------------------
  # Camera / band profiles
  # ----------------------------

  # MAPIR false-color orthophoto profile (what ODM produced for you is RGBA)
  # Your gdalinfo shows:
  #   Band 1 = Red (but in false-color workflows this often contains NIR)
  #   Band 2 = Green
  #   Band 3 = Blue
  #   Band 4 = Alpha
  #
  # We therefore treat Band 1 as NIR and Band 2 as Green and compute
  # a vegetation index of the form:
  #   (NIR - GREEN) / (NIR + GREEN)
  #
  # This is vegetation-index-like (not a true vegetation index). We'll reflect that in code + later in report text.
  mapir_profile:
    index_mode: "nir_green"   # options we will support: "nir_red" or "nir_green"
    nir_band: 1
    green_band: 2
    red_band: null            # not available as a clean spectral band in this dataset

  # RGB fallback profile (only used if MAPIR orthophoto does not exist)
  # This remains a "pseudo" vegetation index unless RGB truly contains NIR.
  rgb_profile:
    index_mode: "pseudo"
    red_band: 1
    nir_band: 2

weather:
  base_url: "http://127.0.0.1:8010"

# OpenAgri Irrigation Management Service integration
irrigation:
  base_url: "http://127.0.0.1:8004"
  auth:
    email: ""
  default_parcel_wkt: "POINT (35.2600 25.6000)"

  # ETo retrieval settings (official get-calculations workflow)
  eto:
    location_id: 1
    days_back: 1

orthophoto:
  odm_docker_image: "opendronemap/odm:latest"
  orthophoto_resolution_cm: 1

app:
  deployment_mode: "local"  # local, self_hosted, or cloud
  public_url: ""
  min_free_disk_gb: 50
  max_active_odm_runs: 1
  external_access_protection_confirmed: false


pdm:
  enabled_by_default: true
  base_url: "http://127.0.0.1:8006"
  default_crop: "grapevine"
  default_model_key: "grapevine_powdery_mildew_risk_v1"
  allow_per_run_override: true
  verify_ssl: false
