[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrivision-pipeline"
version = "0.1.0"
description = "Drone imagery pipeline for orthophotos, vegetation analysis, grid assessment, and farmer-ready reporting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AgriVision contributors" }
]
license = { file = "LICENSE" }
dependencies = [
  "affine>=2.4.0",
  "attrs>=25.4.0",
  "click>=8.3.1",
  "matplotlib>=3.10.7",
  "numpy>=2.3.5",
  "packaging>=25.0",
  "pillow>=12.0.0",
  "PyYAML>=6.0.3",
  "rasterio>=1.4.3",
  "requests>=2.32.5",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
]

[project.scripts]
agrivision = "agrivision.app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "black>=24.0.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agrivision*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  ".venv",
  "venv",
  "__pycache__",
  "agrivision_pipeline.egg-info",
  "OpenAgri-IrrigationManagement",
  "OpenAgri-WeatherService",
  "output",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]


[tool.setuptools.package-data]
agrivision = ["app/web/templates/*.html", "app/web/static/*.css", "app/web/static/*.js"]
