[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrivision-pipeline"
version = "0.1.0"
description = "Drone imagery pipeline for orthophotos, vegetation analysis, grid assessment, and farmer-ready reporting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AgriVision contributors" }
]
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "black>=24.0.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agrivision*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  "venv",
  "__pycache__",
  "agrivision_pipeline.egg-info",
  "OpenAgri-IrrigationManagement",
  "OpenAgri-WeatherService",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
