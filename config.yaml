# Global configuration for the AgriVision Pipeline

location:
  name: "Neapolis, Agios Nikolaos, Crete"
  lat: 35.2600
  lon: 25.6000

paths:
  data_root: "data"
  output_root: "output"

  # RGB images (default dataset for current pipeline)
  images_full: "data/images_full/rgb"
  # ODM projects
  # For backwards compatibility, odm_project_root points to the RGB project.
  odm_project_root: "data/odm_project_rgb"
  odm_project_root_rgb: "data/odm_project_rgb"
  odm_project_root_mapir: "data/odm_project_mapir"

  # NDVI + runs output
  ndvi_output: "output/ndvi"
  runs_output: "output/runs"

  # MAPIR image paths (for multispectral / false-color)
  images_full_mapir: "data/images_full/mapir"
ndvi:
  # Classification thresholds (used by grid/report)
  poor_max: 0.25
  medium_max: 0.4
  threshold_mode: "percentile"   # fixed or percentile
  calibration_percentiles: [33, 66]
  min_cell_valid_fraction: 0.2
  grid_rows: 17
  grid_cols: 17

  # ----------------------------
  # Camera / band profiles
  # ----------------------------

  # MAPIR false-color orthophoto profile.
  # The generated orthophoto's band 2 is saturated/mostly zero, so the
  # previous (band 1 - band 2) / (band 1 + band 2) index pegged near 1.0.
  # Band 3 vs band 1 gives a usable spread for demo vegetation-index work.
  mapir_profile:
    index_mode: "nir_red"     # options we will support: "nir_red" or "nir_green"
    nir_band: 3
    green_band: null
    red_band: 1

  # RGB fallback profile (only used if MAPIR orthophoto does not exist)
  # This remains a "pseudo" vegetation index unless RGB truly contains NIR.
  rgb_profile:
    index_mode: "pseudo"
    red_band: 1
    nir_band: 2

weather:
  base_url: "http://127.0.0.1:8010"
  service_dir: "OpenAgri-WeatherService"

# OpenAgri Irrigation Management Service integration
irrigation:
  base_url: "http://127.0.0.1:8004"
  auth:
    email: ""
  default_parcel_wkt: "POINT (35.2600 25.6000)"

  # ETo retrieval settings (official get-calculations workflow)
  eto:
    location_id: 1
    days_back: 1

orthophoto:
  odm_docker_image: "opendronemap/odm:3.5.6"
  orthophoto_resolution_cm: 1

app:
  deployment_mode: "local"  # local, self_hosted, or cloud
  public_url: ""
  min_free_disk_gb: 50
  max_active_odm_runs: 1

# OpenAgri Pest & Disease Management Service integration
pdm:
  enabled_by_default: true
  base_url: "http://127.0.0.1:8006"
  auth:
    username: ""
  verify_ssl: false
  default_crop: "grapevine"
  default_model_key: "grapevine_powdery_mildew_risk_v1"
  timeout_seconds: 20
  service_dir: "OpenAgri-PestAndDiseaseManagement"
