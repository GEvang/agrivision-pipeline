services:
  agrivision:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrivision-pipeline:phase5
    container_name: agrivision-pipeline
    working_dir: /app
    ports:
      - "8008:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGRIVISION_CONFIG_PATH: /app/config.yaml
      AGRIVISION_RUNTIME_SETTINGS_PATH: /app/runtime/settings.json
      APP_CONTAINER_PROJECT_ROOT: /app
      AGRIVISION_APP_CONTAINER_NAME: agrivision-pipeline
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./runtime:/app/runtime
    command: ["python", "run.py", "--serve-dashboard", "--host", "0.0.0.0", "--port", "8008"]
